name: Build, Push, and Deploy
on:
  push:
    branches: [ rick-test ]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image
        env:
          SHORT_SHA: ${{ github.sha[:7] }}
        run: |
          docker build -t "gcr.io/${{ secrets.GCP_PROJECT_ID }}/hello-web3:main-$SHORT_SHA" .
          docker push "gcr.io/${{ secrets.GCP_PROJECT_ID }}/hello-web3:main-$SHORT_SHA"

      - name: Deploy to GKE
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: hello-web3
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/hello-web3:main-${{ github.sha[:7] }}
          cluster_name: helloweb3-cluster
          location: us-central1
          credentials: ${{ secrets.GCP_SA_KEY }}